    .btn-reset { background: #5d4037; }
    .results-banner { background: #e8f5e9; border: 2px solid var(--correct); border-radius: 8px; padding: 16px; text-align: center; margin-bottom: 16px; }
    .results-banner.failed { background: #ffebee; border-color: var(--incorrect); }
    .results-score { font-size: 1.5rem; font-weight: bold; color: #1b5e20; }
    .results-banner.failed .results-score { color: var(--incorrect); }

    .opt-correct { background: #c8e6c9 !important; border-color: var(--correct) !important; font-weight: 600; color: #1b5e20; }

let currentSetIndex = 0;

// Initialize set dropdown menu
const setSelect = document.getElementById('setSelect');
for (let i = 1; i <= 10; i++) {
  const opt = document.createElement('option');
  opt.value = i - 1;
  opt.textContent = `Set ${i} (10 Questions)`;
  setSelect.appendChild(opt);
}

function loadSelectedSet() {
  currentSetIndex = parseInt(document.getElementById('setSelect').value);
  renderSet(currentSetIndex);
}

function renderSet(setIdx) {
  const form = document.getElementById('quizForm');
  const resultBox = document.getElementById('resultBox');
  const submitBtn = document.getElementById('submitBtn');
  const retakeBtn = document.getElementById('retakeBtn');

  resultBox.innerHTML = '';
  submitBtn.style.display = 'block';
  retakeBtn.style.display = 'none';
  form.innerHTML = '';

  const questions = QUIZ_DATA[setIdx];

  questions.forEach((qObj, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `qCard_${idx}`;

    let html = `<div class="q-meta">Question ${idx + 1} of 10 • ${qObj.chapter}</div>`;
    html += `<div class="q-text">${qObj.q}</div>`;
    
    qObj.o.forEach((optText, oIdx) => {
      html += `
        <label class="option-label" id="optLabel_${idx}_${oIdx}">
          <input type="radio" name="q_${idx}" value="${oIdx}" />
          <span>${String.fromCharCode(65 + oIdx)}. ${optText}</span>
        </label>
      `;
    });

    html += `<div class="explanation" id="exp_${idx}">${qObj.e}</div>`;
    card.innerHTML = html;
    form.appendChild(card);
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function gradeQuiz() {
  const questions = QUIZ_DATA[currentSetIndex];
  let score = 0;
  let answeredCount = 0;

  questions.forEach((qObj, idx) => {
    const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
    const expBox = document.getElementById(`exp_${idx}`);
    expBox.style.display = 'block';

    if (selected) {
      answeredCount++;
      const userVal = parseInt(selected.value);
      if (userVal === qObj.a) {
        score++;
        document.getElementById(`optLabel_${idx}_${userVal}`).classList.add('opt-correct');
        expBox.style.background = '#e8f5e9';
        expBox.style.color = '#2e7d32';
        expBox.innerHTML = `<strong>✓ Correct!</strong><br>${qObj.e}`;
      } else {
        document.getElementById(`optLabel_${idx}_${userVal}`).classList.add('opt-wrong');
        document.getElementById(`optLabel_${idx}_${qObj.a}`).classList.add('opt-correct');
        expBox.style.background = '#ffebee';
        expBox.style.color = '#c62828';
        expBox.innerHTML = `<strong>✗ Incorrect. Correct Answer: (${String.fromCharCode(65 + qObj.a)})</strong><br>${qObj.e}`;
      }
    } else {
      document.getElementById(`optLabel_${idx}_${qObj.a}`).classList.add('opt-correct');
      expBox.style.background = '#fff8e1';
      expBox.style.color = '#f57f17';
      expBox.innerHTML = `<strong>⚠️ Not Attempted. Correct Answer: (${String.fromCharCode(65 + qObj.a)})</strong><br>${qObj.e}`;
    }
  });

  const percentage = Math.round((score / questions.length) * 100);
  const resultBox = document.getElementById('resultBox');
  resultBox.innerHTML = `
    <div class="results-banner ${percentage < 40 ? 'failed' : ''}">
      <div class="results-score">${score} / ${questions.length} (${percentage}%)</div>
      <p style="margin:6px 0 0 0; font-size:0.95rem;">
        ${percentage >= 80 ? '🌟 Outstanding Mastery!' : percentage >= 50 ? '👍 Good Effort! Review the answers highlighted below.' : '⚠️ Needs Revision. Carefully study the textbook page citations below.'}
      </p>
      <p style="margin:4px 0 0 0; font-size:0.85rem; color:#607d8b;">Answered: ${answeredCount} | Unattempted: ${questions.length - answeredCount}</p>
    </div>
  `;

  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('retakeBtn').style.display = 'block';
  resultBox.scrollIntoView({ behavior: 'smooth' });
}

function resetCurrentSet() {
  renderSet(currentSetIndex);
}

// Initial render
renderSet(0);
</script>
</body>
</html>
