    .btn-reset { background: #5d4037; }
    .results-banner { background: #e8f5e9; border: 2px solid var(--correct); border-radius: 8px; padding: 16px; text-align: center; margin-bottom: 16px; }
    .results-banner.failed { background: #ffebee; border-color: var(--incorrect); }

  { chapter: "Ch 3: Atmosphere and Climate", q: "What is the average height of the troposphere above the Earth's surface?", o: ["50 km", "12 km", "80 km", "700 km"], a: 1, e: "NCERT Ch 3, p. 41: The troposphere has an average height of about 12 kilometers." },
  { chapter: "Ch 4: Early Humans & Civilisation", q: "The profound socio-economic shift from foraging to agriculture and animal husbandry is called the:", o: ["Urban revolution", "Neolithic revolution", "Industrial revolution", "Bronze revolution"], a: 1, e: "NCERT Ch 4, p. 71: The shift to food production and settled life is termed the Neolithic revolution." },
  { chapter: "Ch 5: State and Society up to 1000 CE", q: "What was the basic patrilineal clan lineage traced to a common Vedic sage called?", o: ["Kula", "Gotra", "Jana", "Visha"], a: 1, e: "NCERT Ch 5, p. 121: Gotra refers to patrilineal clan lineage traced to an ancestral rishi." },
  { chapter: "Ch 1: Understanding Social Science", q: "Information gathered by direct observation or scientific measurement is described as:", o: ["Theoretical", "Empirical evidence", "Mythological", "Speculative"], a: 1, e: "NCERT Ch 1, p. 6: Empirical evidence is information gathered by actual observation or testing." },
  { chapter: "Ch 2: Shaping of the Earth's Surface", q: "What is the dense, fluid outer layer of Earth's core primarily composed of?", o: ["Silicon and aluminum", "Iron and nickel", "Magnesium and basalt", "Granite"], a: 1, e: "NCERT Ch 2, p. 14: The outer core is a fluid layer consisting mainly of iron and nickel." },
  { chapter: "Ch 3: Atmosphere and Climate", q: "The southern polar lights observed in high southern latitudes are named:", o: ["Aurora Borealis", "Aurora Australis", "Southern Cross", "Albedo"], a: 1, e: "NCERT Ch 3, p. 42: The southern polar lights are called Aurora Australis." },
  { chapter: "Ch 4: Early Humans & Civilisation", q: "Which ancient Bronze Age script of Egypt was deciphered using the Rosetta Stone?", o: ["Cuneiform", "Hieroglyphic script", "Aramaic", "Brahmi"], a: 1, e: "NCERT Ch 4, p. 62: Hieroglyphs were the script of ancient Egypt deciphered via the Rosetta Stone." },
  { chapter: "Ch 5: State and Society up to 1000 CE", q: "Which Veda contains hymns specifically designed to ward off evil and treat physical ailments?", o: ["Rigveda", "Yajurveda", "Samaveda", "Atharvaveda"], a: 3, e: "NCERT Ch 5, p. 99: The Atharvaveda contains chants to ward off evils and treat ailments." },
  { chapter: "Ch 1: Understanding Social Science", q: "Which ancient texts provide philosophical speculations on Atman (Self) and Brahman (Universal Being)?", o: ["Samhitas", "Brahmanas", "Aranyakas", "Upanishads"], a: 3, e: "NCERT Ch 5, p. 99: The Upanishads delve into philosophical inquiries of Atman and Brahman." },
  { chapter: "Ch 2: Shaping of the Earth's Surface", q: "When water freezes inside rock cracks, expands, and splits the rock, which weathering occurs?", o: ["Chemical", "Physical weathering", "Biological", "Atomic"], a: 1, e: "NCERT Ch 2, p. 19: Frost wedging and temperature changes are examples of physical weathering." },
  { chapter: "Ch 3: Atmosphere and Climate", q: "The altitude of a geographic location is measured as its vertical elevation above:", o: ["Ground level", "Mean sea level", "Cloud base", "Lithosphere base"], a: 1, e: "NCERT Ch 3, p. 41: Altitude is measured as elevation above mean sea level." },
  { chapter: "Ch 4: Early Humans & Civilisation", q: "Around 12,000 years ago, what major climatic change encouraged the Mesolithic population boom?", o: ["Ice age onset", "Earth became warmer", "Global cooling", "Deserts vanished"], a: 1, e: "NCERT Ch 4, p. 70: Around 12,000 years ago, the climate warmed, causing grasslands and forests to expand." },
  { chapter: "Ch 5: State and Society up to 1000 CE", q: "In the Vedic period, a group of villages (gramas) formed a larger unit called:", o: ["Kula", "Visha", "Jana", "Rashtra"], a: 1, e: "NCERT Ch 5, p. 121: A group of grāmas formed a viśha, headed by a vishapati." },
  { chapter: "Ch 1: Understanding Social Science", q: "What term describes the discipline analyzing the production, trade, and consumption of goods?", o: ["Sociology", "Economics", "Civics", "Political Science"], a: 1, e: "NCERT Ch 1, p. 10: Economics studies how goods and services are produced, distributed, and exchanged." },
  { chapter: "Ch 2: Shaping of the Earth's Surface", q: "What triangular alluvial deposit is formed where a river enters an ocean or lake and drops its sediment?", o: ["Meander", "Delta", "Gorge", "Rapids"], a: 1, e: "NCERT Ch 2, p. 24: A delta is a fan-shaped or triangular landform deposited at a river mouth." },
  { chapter: "Ch 3: Atmosphere and Climate", q: "What local nocturnal breeze blows from the land toward the sea after sunset?", o: ["Sea breeze", "Land breeze", "Trade wind", "Westerly"], a: 1, e: "NCERT Ch 3, p. 46: Land breeze blows from land to sea at night as land cools faster." },
  { chapter: "Ch 4: Early Humans & Civilisation", q: "The famous Neolithic hilltop granite settlement of Sanganakallu (c. 2000 BCE) is located in:", o: ["Karnataka", "Gujarat", "Punjab", "Bihar"], a: 0, e: "NCERT Ch 4, p. 73: Sanganakallu is a Neolithic granite hill site in Karnataka." },
  { chapter: "Ch 5: State and Society up to 1000 CE", q: "In the Rigveda, which famous hymn in Book 10 first mentions the four varnas?", o: ["Nasadiya Sukta", "Purusha Sukta", "Gayatri Sukta", "Agni Sukta"], a: 1, e: "NCERT Ch 5, p. 119: The Purushasūkta in Book 10 contains the earliest reference to the four varṇas." },
  { chapter: "Ch 1: Understanding Social Science", q: "Which tool of Geography provides digital geographic analysis using spatial data layers?", o: ["GIS (Geographical Information System)", "Barometer", "Seismograph", "Hydrometer"], a: 0, e: "NCERT Ch 1, p. 5: GIS allows digital analysis and representation of spatial geographic data." },
  { chapter: "Ch 2: Shaping of the Earth's Surface", q: "What are sharp, pointed rock pinnacles rising from the floor of limestone caves called?", o: ["Stalactites", "Stalagmites", "Pillars", "Sinkholes"], a: 1, e: "NCERT Ch 2, p. 31: Stalagmites grow upward from cave floors due to dripping mineral water." },
  { chapter: "Ch 3: Atmosphere and Climate", q: "In the Beaufort wind scale, a wind speed of 103 to 117 km/hr with widespread damage is classed as a:", o: ["Light breeze", "Strong breeze", "Storm", "Calm"], a: 2, e: "NCERT Ch 3, p. 46: Wind speeds between 103–117 km/hr are classed as storms causing widespread damage." },
  { chapter: "Ch 4: Early Humans & Civilisation", q: "What was the base number used in the ancient Sumerian mathematical counting system?", o: ["Base 10", "Base 60", "Base 20", "Base 100"], a: 1, e: "NCERT Ch 4, p. 81: Sumerians used a sexagesimal system based on the number 60." },
  { chapter: "Ch 5: State and Society up to 1000 CE", q: "The fourfold goals of life in classical Indian philosophy are known as:", o: ["Ashramas", "Purusharthas", "Varnas", "Samskaras"], a: 1, e: "NCERT Ch 5, p. 122: The four puruṣhārthas are dharma, artha, kāma, and mokṣha." },
  { chapter: "Ch 1: Understanding Social Science", q: "Which subfield of Social Science focuses on power dynamics and citizen responsibilities?", o: ["Political Science", "Geography", "History", "Psychology"], a: 0, e: "NCERT Ch 1, p. 9: Political Science examines governance systems, constitutional law, and civic rights." },
  { chapter: "Ch 2: Shaping of the Earth's Surface", q: "The movement of weathered rock material from one location to another by wind or water is:", o: ["Weathering", "Erosion", "Metamorphism", "Faulting"], a: 1, e: "NCERT Ch 2, p. 20: Erosion involves the transport of weathered materials by natural agents." },
  { chapter: "Ch 3: Atmosphere and Climate", q: "Which traditional Indian season spans the months of Jyeshtha and Ashadha (May–June)?", o: ["Vasanta", "Grishma", "Varsha", "Sharad"], a: 1, e: "NCERT Ch 3, p. 48: Grīshma (Summer) covers Jyeshtha–Āṣhāḍha." },
  { chapter: "Ch 4: Early Humans & Civilisation", q: "Which Mesopotamian empire supplanted the Akkadians around 2154 BCE?", o: ["Assyrian empire", "Hittite empire", "Persian empire", "Macedonian empire"], a: 0, e: "NCERT Ch 4, p. 83: The Assyrian civilisation supplanted Akkadian rule around 2154 BCE." },
  { chapter: "Ch 5: State and Society up to 1000 CE", q: "The sixteen rites of passage accompanying an individual through life in early India were called:", o: ["Purusharthas", "Shodasha samskaras", "Ashramas", "Variyams"], a: 1, e: "NCERT Ch 5, p. 121: Life stages were accompanied by the ṣhoḍaśha saṁskāras (sixteen rites)." },

  // --- SET 3 (Indices 100 - 149) ---

  { chapter: "Ch 2: Shaping of the Earth's Surface", q: "What type of dune has multiple arms and forms where winds blow from varying directions?", o: ["Barchan", "Transverse", "Star dune", "Parabolic"], a: 2, e: "NCERT Ch 2, p. 30: Star dunes have multiple arms formed by shifting multidirectional winds." },
  { chapter: "Ch 3: Atmosphere and Climate", q: "When water vapour condenses and falls back to the Earth in liquid form, it is called:", o: ["Snow", "Hail", "Rain", "Sleet"], a: 2, e: "NCERT Ch 3, p. 44: Liquid precipitation is termed rain." },
  { chapter: "Ch 4: Early Humans & Civilisation", q: "Which river valley hosted the emergence of ancient Mesopotamian civilization?", o: ["Nile", "Indus", "Tigris and Euphrates", "Huang He"], a: 2, e: "NCERT Ch 4, p. 77: Mesopotamia was drained by the Tigris and Euphrates rivers." },
  { chapter: "Ch 5: State and Society up to 1000 CE", q: "Which ancient university in Bihar was established around 427 CE as a premier Buddhist learning center?", o: ["Takshashila", "Nalanda university", "Vikramshila", "Vallabhi"], a: 1, e: "NCERT Ch 5, p. 109: Nalanda University was founded around 427 CE." },
  { chapter: "Ch 1: Understanding Social Science", q: "What term describes the branch of Social Science examining systems of authority and civic rights?", o: ["Sociology", "Political Science", "Geography", "Economics"], a: 1, e: "NCERT Ch 1, p. 9: Political Science studies constitutional law, governance, and citizen rights." },
  { chapter: "Ch 2: Shaping of the Earth's Surface", q: "What feature forms along divergent plate boundaries where tectonic plates pull apart under oceans?", o: ["Deep sea trenches", "Mid-ocean ridges", "Fold mountains", "Transform faults"], a: 1, e: "NCERT Ch 2, p. 15: Magma rises at divergent ocean boundaries to form mid-ocean ridges." },
  { chapter: "Ch 3: Atmosphere and Climate", q: "In which two layers of the atmosphere does temperature decrease with increasing altitude?", o: ["Troposphere and Mesosphere", "Stratosphere and Thermosphere", "Troposphere and Stratosphere", "Mesosphere and Exosphere"], a: 0, e: "NCERT Ch 3, p. 42: Temperature decreases with altitude exclusively in the troposphere and mesosphere." },
  { chapter: "Ch 4: Early Humans & Civilisation", q: "Which French scholar successfully deciphered ancient Egyptian hieroglyphic writing in 1822?", o: ["Pierre Bouchard", "Jean-François Champollion", "Arthur Evans", "Mortimer Wheeler"], a: 1, e: "NCERT Ch 4, p. 84: Jean-François Champollion deciphered the Rosetta Stone in 1822." },
  { chapter: "Ch 5: State and Society up to 1000 CE", q: "What was the administrative province called in the Gupta empire in northern India?", o: ["Mandalam", "Bhukti", "Nadu", "Kottram"], a: 1, e: "NCERT Ch 5, p. 111: Provinces were termed bhuktis in northern India and mandalams in the south." },
  { chapter: "Ch 1: Understanding Social Science", q: "Which ancient scripture provides the earliest collection of poetic hymns in Sanskrit literature?", o: ["Rigveda", "Yajurveda", "Samaveda", "Atharvaveda"], a: 0, e: "NCERT Ch 1, p. 7 & Ch 5, p. 99: The Rigveda is the oldest surviving corpus of poetic compositions." },
  { chapter: "Ch 2: Shaping of the Earth's Surface", q: "What is the continuous contour trench (CCT) designed to prevent on hill slopes?", o: ["Volcanic eruption", "Soil erosion and rainwater runoff", "Earthquakes", "Tsunamis"], a: 1, e: "NCERT Ch 2, p. 21: Contouring slows runoff and prevents soil erosion while recharging groundwater." },
  { chapter: "Ch 3: Atmosphere and Climate", q: "Winds are formally named in meteorology after:", o: ["The destination they blow to", "The direction they blow from", "Their speed", "Their temperature"], a: 1, e: "NCERT Ch 3, p. 45: Winds are designated based on the direction from which they blow (e.g., Westerly)." },
  { chapter: "Ch 4: Early Humans & Civilisation", q: "The Sumerians are credited with which groundbreaking transport invention?", o: ["Steam engine", "Wheeled cart and sailboat", "Compass", "Gunpowder"], a: 1, e: "NCERT Ch 4, p. 81: Sumerians invented the wheeled cart and sailboat." },
  { chapter: "Ch 5: State and Society up to 1000 CE", q: "Which rock temple at Ellora was carved out of a single rock cliff between 756 and 773 CE?", o: ["Brihadeeshwara", "Kailasa Temple", "Shore Temple", "Konark Sun Temple"], a: 1, e: "NCERT Ch 5, p. 112: The rock-cut Kailasa Temple at Ellora was built under the Rashtrakutas." },
  { chapter: "Ch 1: Understanding Social Science", q: "The concept of Pañchamahābhūtas includes earth, water, fire, air, and:", o: ["Metal", "Space (akasha)", "Wood", "Electricity"], a: 1, e: "NCERT Ch 1, p. 3: The five elements are Prithvi, Apah, Agni, Vāyu, and Ākāśha (space)." },
  { chapter: "Ch 2: Shaping of the Earth's Surface", q: "What are smooth, polished desert rocks shaped by wind-blown sand blasting called?", o: ["Yardangs", "Ventifacts", "Sinkholes", "Moraines"], a: 1, e: "NCERT Ch 2, p. 29: Ventifacts are rocks polished and faceted by wind-driven sand." },
  { chapter: "Ch 3: Atmosphere and Climate", q: "Which Indian season covers the autumn months of Ashvina and Kartika (September–October)?", o: ["Vasanta", "Grishma", "Varsha", "Sharad"], a: 3, e: "NCERT Ch 3, p. 48: Sharad corresponds to Āśhvina–Kārtika." },
  { chapter: "Ch 4: Early Humans & Civilisation", q: "Which ancient civilization developed writing on paper made from the papyrus reed?", o: ["Mesopotamia", "Egypt", "China", "Indus Valley"], a: 1, e: "NCERT Ch 4, p. 84: Egyptians produced writing scrolls from papyrus reed stems." },
  { chapter: "Ch 5: State and Society up to 1000 CE", q: "In Kautilya's Saptamga model, what does the term 'Kosha' represent?", o: ["King", "Ministers", "Treasury", "Allies"], a: 2, e: "NCERT Ch 5, p. 109: Kosha represents the treasury or wealth of the kingdom." },
  { chapter: "Ch 1: Understanding Social Science", q: "Which of the four core Social Science disciplines studies spatial distributions across Earth's surface?", o: ["History", "Political Science", "Geography", "Economics"], a: 2, e: "NCERT Ch 1, p. 5: Geography investigates the spatial distribution of places, materials, and humans." },
  { chapter: "Ch 2: Shaping of the Earth's Surface", q: "A rapid collapse of a natural moraine dam holding a glacial lake creates a destructive:", o: ["Tsunami", "GLOF", "Avalanche", "Dust storm"], a: 1, e: "NCERT Ch 2, p. 35: GLOFs occur when moraine dams holding glacial lakes collapse suddenly." },
  { chapter: "Ch 3: Atmosphere and Climate", q: "The seasonal reversal in wind direction over a year is the defining characteristic of a:", o: ["Cyclone", "Tornado", "Monsoon", "Typhoon"], a: 2, e: "NCERT Ch 3, p. 49: Monsoon specifically refers to the seasonal reversal of prevailing wind directions." },
  { chapter: "Ch 4: Early Humans & Civilisation", q: "Which ancient site in Gujarat possessed a massive Harappan tidal dockyard built of burnt bricks?", o: ["Dholavira", "Kalibangan", "Lothal", "Surkotada"], a: 2, e: "NCERT Ch 4, p. 80: Lothal features a massive burnt-brick tidal dockyard." },
  { chapter: "Ch 5: State and Society up to 1000 CE", q: "The Damodarpur copper plates describe district administration consisting of how many council members?", o: ["3", "5", "7", "10"], a: 1, e: "NCERT Ch 5, p. 112: The Damodarpur plates record a 5-member district council under Kumaragupta I." },
  { chapter: "Ch 1: Understanding Social Science", q: "The Latin word 'cuneus' from which cuneiform writing gets its name means:", o: ["Circle", "Wedge", "Square", "Clay"], a: 1, e: "NCERT Ch 4, p. 80: Cuneiform originates from the Latin 'cuneus', meaning wedge." },
  { chapter: "Ch 2: Shaping of the Earth's Surface", q: "Which agent of gradation creates sand spits, bars, and coastal cliffs?", o: ["Glaciers", "Wind", "Waves and currents", "Groundwater"], a: 2, e: "NCERT Ch 2, p. 25: Oceanic waves and currents shape coastal beaches, bars, and cliffs." },
  { chapter: "Ch 3: Atmosphere and Climate", q: "In which season does north-western India experience clear, cloudless skies in October and November?", o: ["Summer", "Advancing monsoon", "Post-monsoon (retreating)", "Winter"], a: 2, e: "NCERT Ch 3, p. 47: Post-monsoon months (October–November) are typically cloudless in north-western India." },
  { chapter: "Ch 4: Early Humans & Civilisation", q: "What was the ancient Egyptian name for the spiritual double that survived after death?", o: ["Ba", "Ka", "Ankh", "Ra"], a: 1, e: "NCERT Ch 4, p. 87: Egyptians believed each person had a spiritual double called 'ka'." },
  { chapter: "Ch 5: State and Society up to 1000 CE", q: "In the Sangam text Tolkappiyam, which group represented traders and merchants?", o: ["Arasar", "Antanar", "Vanigar", "Velar"], a: 2, e: "NCERT Ch 5, p. 120: Tolkappiyam refers to Vanigar as merchants and traders." },
  { chapter: "Ch 1: Understanding Social Science", q: "The Samaveda is composed of verses primarily drawn from which earlier Veda?", o: ["Rigveda", "Yajurveda", "Atharvaveda", "Upanishad"], a: 0, e: "NCERT Ch 5, p. 99: Samaveda comprises hymns drawn from the Rigveda, arranged for musical recitation." },
  { chapter: "Ch 2: Shaping of the Earth's Surface", q: "What hollow dissolution depression is formed when the roof of an underground limestone cave collapses?", o: ["Cirque", "Sinkhole or doline", "Fjord", "Blowout"], a: 1, e: "NCERT Ch 2, p. 31: A sinkhole forms when subterranean limestone cavities collapse." },
  { chapter: "Ch 3: Atmosphere and Climate", q: "Which atmospheric gas shields the Earth by trapping outgoing infrared energy from escaping to space?", o: ["Greenhouse gas", "Inert gas", "Noble gas", "Ozone only"], a: 0, e: "NCERT Ch 3, p. 39: Greenhouse gases trap heat, keeping Earth warm enough for life." },
  { chapter: "Ch 4: Early Humans & Civilisation", q: "The Great Wall of China began to be built around 680 BCE primarily to defend against raids by:", o: ["European fleets", "Nomadic northern tribes", "Sumerian armies", "Roman legions"], a: 1, e: "NCERT Ch 4, p. 91: The Great Wall was built to protect farming kingdoms from nomadic raids." },
  { chapter: "Ch 5: State and Society up to 1000 CE", q: "Which medical classic in Sanskrit focuses extensively on surgical instruments and procedures?", o: ["Charakasamhita", "Sushrutasamhita", "Ashtadhyayi", "Amarakosha"], a: 1, e: "NCERT Ch 5, p. 127: The Sushrutasaṁhitā is the classical Sanskrit treatise on surgery." },
  { chapter: "Ch 1: Understanding Social Science", q: "Which scholar deciphered Ashoka's Brahmi script in modern historical research?", o: ["James Prinsep", "Champollion", "Alexander Cunningham", "John Marshall"], a: 0, e: "NCERT Ch 4, p. 62: Brahmi inscriptions were formalised by Ashoka and later deciphered in modern times." },
  { chapter: "Ch 2: Shaping of the Earth's Surface", q: "Earthen embankments built along hillside contour lines to trap moisture are called:", o: ["Terraces", "Bunds (bunding)", "Gullies", "Dams"], a: 1, e: "NCERT Ch 2, p. 21: Bunding refers to earthen embankments constructed along contour lines." },
  { chapter: "Ch 3: Atmosphere and Climate", q: "The Indian winter monsoon blowing from northeast to southwest is typically characterized by winds that are:", o: ["Warm and moist", "Cold and dry", "Hot and humid", "Violent and cyclonic"], a: 1, e: "NCERT Ch 3, p. 52: The northeast winter monsoon carries cold, dry continental air." },
  { chapter: "Ch 4: Early Humans & Civilisation", q: "In ancient China, silk became a major export traded across Central Asia during which dynasty?", o: ["Shang dynasty", "Zhou dynasty", "Han dynasty", "Ming dynasty"], a: 2, e: "NCERT Ch 4, p. 92: Silk export flourished into the famous Silk Route during the Han dynasty." },
  { chapter: "Ch 5: State and Society up to 1000 CE", q: "Which Chola emperor built the Brihadeeshwara Temple at Thanjavur around 1010 CE?", o: ["Karikala", "Rajaraja I", "Rajendra I", "Parantaka I"], a: 1, e: "NCERT Ch 5, pp. 115, 116: Rajaraja I constructed the Brihadeeshwara Temple at Thanjavur." },
  { chapter: "Ch 1: Understanding Social Science", q: "The study of human society, institutions, and relationships based on evidence is:", o: ["Astrology", "Social Science", "Alchemy", "Cosmology"], a: 1, e: "NCERT Ch 1, p. 2: Social Science is the systematic, evidence-based study of human society." },
  { chapter: "Ch 2: Shaping of the Earth's Surface", q: "A knife-edge rocky mountain ridge separating two glacial cirques is an:", o: ["Arete", "Horn", "Moraine", "Esker"], a: 0, e: "NCERT Ch 2, p. 27: An arete is a sharp, narrow mountain ridge formed between glacial cirques." },
  { chapter: "Ch 3: Atmosphere and Climate", q: "What is the primary factor causing atmospheric pressure to decrease with altitude?", o: ["Decrease in gravity and air density", "Increase in ozone", "Higher humidity", "Solar radiation"], a: 0, e: "NCERT Ch 3, p. 45: Air pressure falls rapidly with altitude because air density decreases." },
  { chapter: "Ch 4: Early Humans & Civilisation", q: "Which ancient Bronze Age civilization developed along the Huang He and Yangtze river valleys?", o: ["Mesopotamia", "Chinese civilisation", "Egyptian", "Harappan"], a: 1, e: "NCERT Ch 4, p. 89: Chinese civilization emerged along the Huang He and Yangtze river systems." },
  { chapter: "Ch 5: State and Society up to 1000 CE", q: "What were specialized committees of Chola village assemblies called?", o: ["Urs", "Variyams", "Nadus", "Mandarams"], a: 1, e: "NCERT Ch 5, p. 115: Village committees entrusted with specific tasks were known as variyams." },

// Split 500 questions cleanly into 10 sets of exactly 50 questions each
const SETS = [];
for (let i = 0; i < 10; i++) {
  SETS.push(ALL_500_QUESTIONS.slice(i * 50, (i + 1) * 50));
}

let currentSetIndex = 0;

// Initialize set dropdown
const setSelect = document.getElementById('setSelect');
for (let i = 1; i <= 10; i++) {
  const opt = document.createElement('option');
  opt.value = i - 1;
  opt.textContent = `Set ${i} (50 Questions)`;
  setSelect.appendChild(opt);
}

function loadSelectedSet() {
  currentSetIndex = parseInt(document.getElementById('setSelect').value);
  renderSet(currentSetIndex);
}

function renderSet(setIdx) {
  const form = document.getElementById('quizForm');
  const resultBox = document.getElementById('resultBox');
  const submitBtn = document.getElementById('submitBtn');
  const retakeBtn = document.getElementById('retakeBtn');

  resultBox.innerHTML = '';
  submitBtn.style.display = 'block';
  retakeBtn.style.display = 'none';
  form.innerHTML = '';

  const questions = SETS[setIdx];

  questions.forEach((qObj, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `qCard_${idx}`;

    let html = `<div class="q-meta">Question ${idx + 1} of 50 • ${qObj.chapter}</div>`;
    html += `<div class="q-text">${qObj.q}</div>`;
    
    qObj.o.forEach((optText, oIdx) => {
      html += `
        <label class="option-label" id="optLabel_${idx}_${oIdx}">
          <input type="radio" name="q_${idx}" value="${oIdx}" />
          <span>${String.fromCharCode(65 + oIdx)}. ${optText}</span>
        </label>
      `;
    });

    html += `<div class="explanation" id="exp_${idx}">${qObj.e}</div>`;
    card.innerHTML = html;
    form.appendChild(card);
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function gradeQuiz() {
  const questions = SETS[currentSetIndex];
  let score = 0;
  let answeredCount = 0;

  questions.forEach((qObj, idx) => {
    const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
    const expBox = document.getElementById(`exp_${idx}`);
    expBox.style.display = 'block';

    if (selected) {
      answeredCount++;
      const userVal = parseInt(selected.value);
      if (userVal === qObj.a) {
        score++;
        document.getElementById(`optLabel_${idx}_${userVal}`).classList.add('opt-correct');
        expBox.style.background = '#e8f5e9';
        expBox.style.color = '#2e7d32';
        expBox.innerHTML = `<strong>✓ Correct!</strong><br>${qObj.e}`;
      } else {
        document.getElementById(`optLabel_${idx}_${userVal}`).classList.add('opt-wrong');
        document.getElementById(`optLabel_${idx}_${qObj.a}`).classList.add('opt-correct');
        expBox.style.background = '#ffebee';
        expBox.style.color = '#c62828';
        expBox.innerHTML = `<strong>✗ Incorrect. Correct Answer: (${String.fromCharCode(65 + qObj.a)})</strong><br>${qObj.e}`;
      }
    } else {
      document.getElementById(`optLabel_${idx}_${qObj.a}`).classList.add('opt-correct');
      expBox.style.background = '#fff8e1';
      expBox.style.color = '#f57f17';
      expBox.innerHTML = `<strong>⚠️ Not Attempted. Correct Answer: (${String.fromCharCode(65 + qObj.a)})</strong><br>${qObj.e}`;
    }
  });

  const percentage = Math.round((score / questions.length) * 100);
  const resultBox = document.getElementById('resultBox');
  resultBox.innerHTML = `
    <div class="results-banner ${percentage < 40 ? 'failed' : ''}">
      <div class="results-score">${score} / ${questions.length} (${percentage}%)</div>
      <p style="margin:6px 0 0 0; font-size:0.95rem;">
        ${percentage >= 80 ? '🌟 Outstanding Mastery!' : percentage >= 50 ? '👍 Good Effort! Review the answers highlighted below.' : '⚠️ Needs Revision. Carefully study the textbook page citations below.'}
      </p>
      <p style="margin:4px 0 0 0; font-size:0.85rem; color:#607d8b;">Answered: ${answeredCount} | Unattempted: ${questions.length - answeredCount}</p>
    </div>
  `;

  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('retakeBtn').style.display = 'block';
  resultBox.scrollIntoView({ behavior: 'smooth' });
}

function resetCurrentSet() {
  renderSet(currentSetIndex);
}

// Initial boot to Set 1
renderSet(0);
