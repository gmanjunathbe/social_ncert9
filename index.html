<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Science GK Quiz - Grade 9 NCERT</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #2980b9;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --correct: #27ae60;
            --incorrect: #c0392b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 760px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin: 0 0 6px 0;
            font-size: 1.8rem;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .view-panel {
            display: none;
        }

        .view-panel.active {
            display: block;
        }

        /* Dashboard Styles */
        .set-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .set-card-btn {
            background: white;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 16px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .set-card-btn:hover {
            border-color: var(--accent);
            background: #f0f7ff;
            transform: translateY(-2px);
        }

        .set-card-btn .set-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
            display: block;
        }

        .set-card-btn .set-count {
            font-size: 0.8rem;
            color: #7f8c8d;
            margin-top: 4px;
            display: block;
        }

        /* Quiz View Styles */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .badge {
            background: #e8f4fc;
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .score-counter {
            font-size: 0.9rem;
            font-weight: 600;
            color: #555;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }

        .option-item {
            background: #ffffff;
            border: 2px solid var(--border);
            padding: 14px 16px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            display: flex;
            align-items: center;
        }

        .option-item:hover:not(.disabled) {
            border-color: var(--accent);
            background: #f9fbfe;
        }

        .option-item.correct {
            background: #eafaf1;
            border-color: var(--correct);
            color: #196f3d;
            font-weight: 600;
        }

        .option-item.incorrect {
            background: #fdedec;
            border-color: var(--incorrect);
            color: #922b21;
        }

        .option-item.disabled {
            cursor: default;
        }

        .citation-box {
            background: #eef2f7;
            border-left: 4px solid var(--accent);
            padding: 12px 16px;
            border-radius: 0 6px 6px 0;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
            color: #34495e;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }

        .btn:hover:not(:disabled) {
            opacity: 0.9;
        }

        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #95a5a6;
        }

        /* Result View Styles */
        .result-box {
            text-align: center;
            padding: 20px 0;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #e8f4fc;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0 auto 20px auto;
            border: 4px solid var(--accent);
        }

        .result-msg {
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: var(--primary);
        }
    </style>
</head>

<div class="container">

        <div class="citation-box" id="citationBox"></div>
        <div class="controls">
            <button class="btn btn-secondary" onclick="exitToDashboard()">Exit to Sets</button>
            <button class="btn" id="nextQuestionBtn" onclick="nextQuestion()" disabled>Next Question</button>
        </div>
    </div>

    <!-- 3. Completion / Results Screen -->
    <div id="resultView" class="view-panel result-box">

        <div class="result-msg" id="resultMessage">Good effort! Review your textbook pages to master the details.</div>
        <button class="btn" onclick="exitToDashboard()">Choose Another Set</button>
    </div>
</div>

    let activeSet = 1;
    let questionCursor = 0;
    let runningScore = 0;

    // Render set navigation cards
    function renderDashboard() {
        const grid = document.getElementById('setGridContainer');
        grid.innerHTML = '';
        for (let i = 1; i <= 10; i++) {
            const card = document.createElement('div');
            card.className = 'set-card-btn';
            card.onclick = () => launchSet(i);
            card.innerHTML = `<span class="set-title">Set ${i}</span><span class="set-count">10 Questions</span>`;
            grid.appendChild(card);
        }
    }

    function switchView(viewId) {
        document.querySelectorAll('.view-panel').forEach(el => el.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
    }

    function launchSet(setNum) {
        activeSet = setNum;
        questionCursor = 0;
        runningScore = 0;
        switchView('quizView');
        document.getElementById('badgeIndicator').innerText = `Set ${activeSet}`;
        displayCurrentQuestion();
    }

    function displayCurrentQuestion() {
        const qData = quizDatabase[activeSet][questionCursor];
        document.getElementById('progressIndicator').innerText = `Q ${questionCursor + 1} / 10`;
        document.getElementById('questionText').innerText = qData.q;
        
        const listContainer = document.getElementById('optionsList');
        listContainer.innerHTML = '';
        
        qData.options.forEach((optText, index) => {
            const li = document.createElement('li');
            li.className = 'option-item';
            li.innerText = `${String.fromCharCode(65 + index)}) ${optText}`;
            li.onclick = () => evaluateChoice(index, li);
            listContainer.appendChild(li);
        });

        const citBox = document.getElementById('citationBox');
        citBox.style.display = 'none';
        citBox.innerText = `Verified Source: NCERT Part 1 — ${qData.source}`;
        
        document.getElementById('nextQuestionBtn').disabled = true;
    }

    function evaluateChoice(selectedIdx, element) {
        const qData = quizDatabase[activeSet][questionCursor];
        const allItems = document.getElementById('optionsList').children;
        
        // Lock options
        for (let item of allItems) {
            item.classList.add('disabled');
            item.onclick = null;
        }

        if (selectedIdx === qData.correct) {
            element.classList.add('correct');
            runningScore++;
        } else {
            element.classList.add('incorrect');
            allItems[qData.correct].classList.add('correct');
        }

        document.getElementById('citationBox').style.display = 'block';
        document.getElementById('nextQuestionBtn').disabled = false;
    }

    function nextQuestion() {
        questionCursor++;
        if (questionCursor < 10) {
            displayCurrentQuestion();
        } else {
            showScoreSummary();
        }
    }

    function showScoreSummary() {
        switchView('resultView');
        document.getElementById('scoreDisplay').innerText = `${runningScore}/10`;
        const msg = document.getElementById('resultMessage');
        if (runningScore >= 9) {
            msg.innerText = "Outstanding! Perfect grasp of historical and geographical facts.";
        } else if (runningScore >= 6) {
            msg.innerText = "Good job! A quick revision of the cited pages will make it 10/10.";
        } else {
            msg.innerText = "Keep practicing! Use the cited page numbers to strengthen concepts.";
        }
    }

    function exitToDashboard() {
        switchView('dashboardView');
    }

    renderDashboard();
</script>
